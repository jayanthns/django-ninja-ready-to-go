[project]
name = "django-ninja-ready-to-go"
version = "0.1.0"
description = "Django Ninja API Ready-to-Go Starter Template"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jayanth NS" }
]

dependencies = [
    "Django==4.2.16",
    "django-ninja>=1.3.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "pydantic[email]==2.9.2",
    "django-shinobi>=1.4.0",
    "python-json-logger==2.0.7",
    "gunicorn==22.0.0",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.9",
    "aiohttp==3.9.1",
    "django-redis==6.0.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-django==4.8.0",
    "black==24.8.0",
    "mypy==1.11.1",
    "mypy-extensions==1.0.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "Flake8-pyproject==1.2.3",
    "pytest-mock==3.14.0",
    "requests-mock==1.12.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
pythonpath = "src"
python_files = "test_*.py"
filterwarnings = [
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore:'cgi' is deprecated:DeprecationWarning",
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20"
]
addopts = "--reuse-db --disable-warnings"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
omit = [
    "**/tests/*",
    "*/migrations/*.py",
    "*/urls.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
    "fabfile.py",
    "settings.py",
    "*/endpoints.py",
    "**/admin.py",
    "**/apps.py",
    "**/signals.py",
    "common/background_tasks.py",
    "api_tests/*",
]
source = ["."]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
    "def __str__",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
mypy_path = "."
exclude = ["migrations", "venv", "manage.py", "tests"]
ignore_missing_imports = true
allow_redefinition = false
disallow_untyped_defs = true
warn_return_any = true

[tool.black]
line-length = 110
exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | venv
      | _build
      | buck-out
      | build
      | dist
      | migrations
    )/
'''

[tool.flake8]
ignore = [
    "E501", "E722", "W503", "C101", "E203", "F405", "F403"
]
max-line-length = 110
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "**/admin.py",
    "**/migrations/*"
]

[tool.isort]
profile = "black"
line_length = 110
known_third_party = ["django", "ninja"]
known_first_party = ["platform-global-dashboard-be-service"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_adds = true
force_alphabetical_sort_within_sections = true
skip = ["venv", "migrations"]
