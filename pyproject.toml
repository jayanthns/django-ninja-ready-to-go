[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
pythonpath = "src"
python_files = "test_*.py"
filterwarnings = [
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore:'cgi' is deprecated:DeprecationWarning"
]
addopts = "--reuse-db --disable-warnings"

[tool.coverage.run]
branch = true
omit = [
    "**/tests/*",
    "*/migrations/*.py",
    "*/urls.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
    "fabfile.py",
    "settings.py",
    "*/endpoints.py",
    "**/admin.py",
    "**/apps.py",
    "**/signals.py"
]
source = ["."]

[tool.coverage.report]
show_missing = true
fail_under = 96
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
mypy_path = "."
exclude = ["migrations", "venv", "manage.py", "tests"]
ignore_missing_imports = true
allow_redefinition = false
disallow_untyped_defs = true
warn_return_any = true

[tool.black]
line-length = 110
exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | venv
      | _build
      | buck-out
      | build
      | dist
      | migrations
    )/
'''

[tool.flake8]
ignore = [
    "E501", "E722", "W503", "C101", "E203", "F405", "F403"
]
max-line-length = 110
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "**/admin.py",
    "**/migrations/*"
]

[tool.isort]
profile = "black"
line_length = 110
known_third_party = ["django", "ninja"]
known_first_party = ["platform-global-dashboard-be-service"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_adds = true
force_alphabetical_sort_within_sections = true
skip = ["venv", "migrations"]
